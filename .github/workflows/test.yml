name: Tests automáticos

# Activadores de los tests
on:
  push:
    branches: [main] # Se activa cuando haces git push a la rama main
  pull_request:
    branches: [main] # Se activa cuando abrís un Pull Request hacia main

# Trabajos que tiene que realizar (pueden ser varios)
jobs:
  # nombre del trabajo a realizar (puede llamarse como quieras)
  test:
    # Utiliza un contenedor con Ubuntu que GitHub levanta automáticamente
    runs-on: ubuntu-latest

    # Pasos a seguir dentro del contenedor
    steps:
      # Copia todo el código de tu repositorio dentro del contenedor
      - uses: actions/checkout@v4

      # Instala Node.js dentro del contenedor
      - uses: actions/setup-node@v4
        with:
          node-version: "20" # Versión de Node a instalar
          cache: "npm" # Guarda cache de node_modules para que sea más rápido

      # Instala las dependencias de tu proyecto (npm ci es como npm install pero más rápido y exacto)
      - run: npm ci

      # Ejecuta todos los tests una sola vez (no se queda en modo watch)
      - run: npm run test:run
